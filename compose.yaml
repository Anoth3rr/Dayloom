services:
  dayloom:
    build: .
    restart: unless-stopped
    ports:
      - "${DAYLOOM_BIND_ADDRESS:-127.0.0.1}:4318:4318"
    environment:
      DAYLOOM_REGISTRATION: "${DAYLOOM_REGISTRATION:-true}"
      DAYLOOM_ALLOWED_ORIGINS: "${DAYLOOM_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
    volumes:
      - dayloom-data:/data
volumes:
  dayloom-data:
